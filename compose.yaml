# Runs the whole stack:  docker compose up --build
#   Frontend  http://localhost:4200
#   Backend   http://localhost:8080
#   Postgres  localhost:5432
#   pgAdmin   http://localhost:6060  (only with: docker compose --profile tools up)
name: makers-challenge

services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-makers}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./backend-service/deployment/database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend-service
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-makers}
      DB_USER: ${POSTGRES_USER:-postgres_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      JWT_SECRET: ${JWT_SECRET:-super-secret-key-for-jwt-token-256bits}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-1800000}
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build: ./angular-service
    ports:
      - "4200:4200"
    depends_on:
      - backend

  pgadmin:
    image: dpage/pgadmin4
    profiles: [tools]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "6060:80"
    depends_on:
      - database
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:
