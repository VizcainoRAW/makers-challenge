<header class="topbar">
  <a class="brand" routerLink="/">Makers Loans</a>
  <nav>
    @if (auth.isAuthenticated()) {
      @if (auth.isCustomer()) {
        <a routerLink="/loans/new" routerLinkActive="active">Apply for a loan</a>
      }
      @if (auth.isAdmin()) {
        <a routerLink="/admin/loans" routerLinkActive="active">Loan applications</a>
      }
      <span class="role">{{ auth.currentUser()?.role }}</span>
      <button type="button" class="link" (click)="logout()">Log out</button>
    } @else {
      <a routerLink="/login" routerLinkActive="active">Log in</a>
      <a routerLink="/register" routerLinkActive="active">Register</a>
    }
  </nav>
</header>

<main>
  <router-outlet />
</main>
