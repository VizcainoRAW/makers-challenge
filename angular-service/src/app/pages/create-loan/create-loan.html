<section class="card">
  <h1>Apply for a loan</h1>

  <form (ngSubmit)="submit()">
    <label>
      Amount
      <input type="number" min="0.01" step="0.01" [formControl]="amount" />
      @if (amount.touched && amount.invalid) {
        <span class="field-error">Enter an amount greater than 0</span>
      }
    </label>

    @if (error()) {
      <div class="alert error">{{ error() }}</div>
    }

    @if (created(); as loan) {
      <div class="alert success">
        Application for {{ loan.amount | currency }} submitted on
        {{ loan.createdAt | date: 'medium' }}. Status:
        <span class="badge" [class]="loan.status">{{ loan.status }}</span>
      </div>
    }

    <button type="submit" class="primary" [disabled]="loading()">
      {{ loading() ? 'Submitting…' : 'Submit application' }}
    </button>
  </form>
</section>
