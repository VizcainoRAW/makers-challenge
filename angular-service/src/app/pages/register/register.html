<section class="card">
  <h1>Create account</h1>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Email or username
      <input formControlName="loginIdentifier" autocomplete="username" />
      @if (form.controls.loginIdentifier.touched && form.controls.loginIdentifier.invalid) {
        <span class="field-error">Required</span>
      }
    </label>

    <label>
      Password
      <input type="password" formControlName="password" autocomplete="new-password" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <span class="field-error">At least 6 characters</span>
      }
    </label>

    <label>
      Role
      <select formControlName="role">
        @for (role of roles; track role) {
          <option [value]="role">{{ role }}</option>
        }
      </select>
    </label>

    @if (error()) {
      <div class="alert error">{{ error() }}</div>
    }

    <button type="submit" class="primary" [disabled]="loading()">
      {{ loading() ? 'Creating…' : 'Create account' }}
    </button>
  </form>

  <p class="muted">Already registered? <a routerLink="/login">Log in</a></p>
</section>
