server:
  port: 8080
spring:
  application:
    name: "makers-service"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"

jwt:
  secret: ${JWT_SECRET:super-secret-key-for-jwt-token-256bits}
  expiration-ms: ${JWT_EXPIRATION_MS:1800}
  issuer: ${JWT_ISSUER:makers}

adapters:
  r2dbc:
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:5432}
    database: ${DB_NAME:makers}
    schema: ${DB_SCHEMA:public}
    username: ${DB_USER:postgres_user}
    password: ${DB_PASSWORD:postgres_password}
